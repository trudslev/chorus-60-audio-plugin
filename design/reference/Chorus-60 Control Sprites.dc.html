<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html, body { margin: 0; padding: 0; background: #0E1012; }
a { color: #cfd7dc; }
a:hover { color: #fff; }
</style>
</helmet>
<div style="min-height:100vh;padding:40px;background:#0E1012;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;font-family:ui-sans-serif,system-ui,sans-serif">

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">button-ii · 132</div>
    <div id="button-ii" style="width:132px;height:132px;border-radius:5px;background:linear-gradient(160deg,#E5A021,#C07908);box-shadow:0 1px 1px rgba(255,255,255,.4) inset, 0 -7px 12px -4px rgba(0,0,0,.5) inset"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">button-i · 132</div>
    <div id="button-i" style="width:132px;height:132px;border-radius:5px;background:linear-gradient(160deg,#EAD681,#D0B857);box-shadow:0 1px 1px rgba(255,255,255,.5) inset, 0 -7px 12px -4px rgba(0,0,0,.45) inset"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">button-off · 132</div>
    <div id="button-off" style="width:132px;height:132px;border-radius:5px;background:linear-gradient(160deg,#EAECEC,#C9CDCF);box-shadow:0 1px 1px rgba(255,255,255,.85) inset, 0 -7px 12px -4px rgba(0,0,0,.35) inset"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">lamp-on · 96 (LED at 48,48)</div>
    <div id="lamp-on" style="width:96px;height:96px;position:relative">
      <div style="position:absolute;left:40.5px;top:40.5px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#FF2B1C,#B0140C 70%,#6D0B06);box-shadow:0 0 12px 3px rgba(255,43,28,.55), 0 0 30px 8px rgba(255,43,28,.22)"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">lamp-off · 96 (LED at 48,48)</div>
    <div id="lamp-off" style="width:96px;height:96px;position:relative">
      <div style="position:absolute;left:40.5px;top:40.5px;width:15px;height:15px;border-radius:50%;background:#3A1512;box-shadow:0 1px 0 rgba(255,255,255,.14) inset"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">switch-track · 34×68</div>
    <div id="switch-track" style="width:34px;height:68px;border-radius:17px;background:linear-gradient(#0A0C0D,#141719);box-shadow:0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.85) inset"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">switch-thumb · 26×26</div>
    <div id="switch-thumb" style="width:26px;height:26px;border-radius:50%;background:linear-gradient(#E4E8EA,#A9B0B5);box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 3px 6px -1px rgba(0,0,0,.85)"></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">switch-stereo · 34×68 (composed)</div>
    <div id="switch-stereo" style="position:relative;width:34px;height:68px;border-radius:17px;background:linear-gradient(#0A0C0D,#141719);box-shadow:0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.85) inset">
      <div style="position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(#E4E8EA,#A9B0B5);box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 3px 6px -1px rgba(0,0,0,.85)"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;letter-spacing:.18em;color:#8A9196">switch-mono · 34×68</div>
    <div id="switch-mono" style="position:relative;width:34px;height:68px;border-radius:17px;background:linear-gradient(#0A0C0D,#141719);box-shadow:0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.85) inset">
      <div style="position:absolute;left:4px;top:38px;width:26px;height:26px;border-radius:50%;background:linear-gradient(#E4E8EA,#A9B0B5);box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 3px 6px -1px rgba(0,0,0,.85)"></div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
