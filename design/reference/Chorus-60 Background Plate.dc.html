<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
@font-face { font-family: 'Librestile Extended'; src: url('assets/LibrestileExtBold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
html, body { margin: 0; padding: 0; background: #050506; }
a { color: #cfd7dc; }
a:hover { color: #fff; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:flex-start;padding:34px 24px;background:#050506;overflow-x:auto">
  <div id="plate" style="width:1400px;flex:0 0 1400px;margin-inline:auto;background:linear-gradient(#141618,#0E1012 35%,#0A0C0D);border:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 34px 70px -24px rgba(0,0,0,1)">

    <div style="display:flex;align-items:flex-end;gap:0;padding:16px 24px 14px;border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.05);background:linear-gradient(#191C1E,#101214)">
      <div style="display:flex;align-items:flex-end;gap:18px;flex-shrink:0;white-space:nowrap">
        <div style="font-family:'Librestile Extended','Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:.9;letter-spacing:.02em;color:#E6EBEE;text-shadow:0 1px 0 rgba(0,0,0,.9), 0 0 1px rgba(230,235,238,.5)"><span style="visibility:hidden">CHORUS-60</span></div>
        <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:3px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.24em;color:#8A9196"><span style="visibility:hidden">BBD CHORUS PROCESSOR</span></div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.24em;color:#5F666B"><span style="visibility:hidden">MODEL CH-60 · STEREO</span></div>
        </div>
      </div>

      <div style="flex:1"></div>

      <div style="display:flex;align-items:flex-end;gap:6px;flex-shrink:0">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.24em;color:#7B8287"><span style="visibility:hidden">IN</span></div>
          <div style="display:flex;align-items:stretch;height:25px;background:#07090A;border:1px solid #363C41;box-shadow:0 2px 6px rgba(0,0,0,.9) inset">
            <div style="width:37px;border-right:1px solid #2A3035"></div>
            <div style="min-width:238px"></div>
          </div>
        </div>
        <div style="width:44px;height:25px"></div>
        <div style="width:53px;height:25px"></div>
      </div>

      <div style="display:flex;gap:8px;padding-left:18px;flex-shrink:0;white-space:nowrap">
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.24em;color:#7B8287"><span style="visibility:hidden">IN</span></div>
          <div style="width:52px;height:25px;background:#07090A;border:1px solid #363C41;box-shadow:0 2px 6px rgba(0,0,0,.9) inset"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.24em;color:#7B8287"><span style="visibility:hidden">IN</span></div>
          <div style="width:52px;height:25px;background:#07090A;border:1px solid #363C41;box-shadow:0 2px 6px rgba(0,0,0,.9) inset"></div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:stretch;gap:0;padding:18px 24px 20px;background:linear-gradient(#0E1012,#0A0C0D)">

      <div style="flex:0 0 232px;display:flex;flex-direction:column">
        <div style="height:24px;background:linear-gradient(#2F6DB8,#1F5798);display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.4em;color:#EEF2F4;text-indent:.4em"><span style="visibility:hidden">CHORUS</span></span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:26px 0 26px 6px">
          <div style="display:flex;align-items:center;gap:20px">
            <div style="width:116px;height:116px"></div>
            <div style="display:flex;align-items:center;gap:14px">
              <div style="width:15px;height:15px"></div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:#7C8388"><span style="visibility:hidden">II</span></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:20px">
            <div style="width:116px;height:116px"></div>
            <div style="display:flex;align-items:center;gap:14px">
              <div style="width:15px;height:15px"></div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:#7C8388"><span style="visibility:hidden">II</span></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:20px">
            <div style="width:116px;height:116px"></div>
            <div style="display:flex;align-items:center;gap:14px">
              <div style="width:15px;height:15px"></div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.14em;color:#7C8388"><span style="visibility:hidden">OFF</span></div>
            </div>
          </div>
        </div>
        <div style="height:12px;background:linear-gradient(#2F6DB8,#1F5798)"></div>
      </div>

      <div style="flex:0 0 1px;margin:0 22px;background:linear-gradient(transparent,rgba(0,0,0,.9) 12%,rgba(0,0,0,.9) 88%,transparent);box-shadow:1px 0 0 rgba(255,255,255,.06)"></div>

      <div style="flex:1;display:flex;flex-direction:column;gap:16px;min-width:0">

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.28em;color:#8A9196"><span style="visibility:hidden">SECTION</span></div>
            <div style="display:flex;gap:26px"><div style="height:15px"></div></div>
          </div>
          <div style="height:122px;background:linear-gradient(#0B0D0E,#080A0B);border:1px solid #0A0C0D;box-shadow:0 2px 7px rgba(0,0,0,.85) inset"></div>
        </div>

        <div style="display:flex;gap:16px">
          <sc-for list="{{ engineGroups }}" as="g" hint-placeholder-count="2">
            <div style="flex:1;border:1px solid #000;background:linear-gradient(#131517,#0C0E10);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;padding:9px 14px 14px">
              <div style="display:flex;align-items:center;gap:9px;padding-bottom:7px;border-bottom:1px solid rgba(0,0,0,.6);box-shadow:0 1px 0 rgba(255,255,255,.05)">
                <div style="width:8px;height:8px"></div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.28em;color:#8A9196"><span style="visibility:hidden">SECTION</span></div>
              </div>
              <div style="display:flex;justify-content:space-evenly;gap:44px;padding-top:14px">
                <sc-for list="{{ g.knobs }}" as="k" hint-placeholder-count="2">
                  <div style="display:flex;flex-direction:column;align-items:center;gap:9px;width:92px">
                    <div style="width:58px;height:58px"></div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.18em;color:#8A9196;text-align:center"><span style="visibility:hidden">LABEL</span></div>
                    <div style="height:15px"></div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display:flex;gap:16px">
          <sc-for list="{{ lowerGroups }}" as="g" hint-placeholder-count="3">
            <div style="flex:{{ g.flex }};border:1px solid #000;background:linear-gradient(#131517,#0C0E10);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;padding:9px 14px 14px">
              <div style="padding-bottom:7px;border-bottom:1px solid rgba(0,0,0,.6);box-shadow:0 1px 0 rgba(255,255,255,.05);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.28em;color:#8A9196"><span style="visibility:hidden">SECTION</span></div>
              <div style="display:flex;justify-content:space-evenly;gap:26px;padding-top:14px">
                <sc-for list="{{ g.knobs }}" as="k" hint-placeholder-count="2">
                  <div style="display:flex;flex-direction:column;align-items:center;gap:9px;width:84px">
                    <div style="width:42px;height:42px"></div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.18em;color:#8A9196;text-align:center"><span style="visibility:hidden">LABEL</span></div>
                    <div style="height:15px"></div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;align-items:center;padding:7px 24px 9px;border-top:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.045) inset;background:linear-gradient(#131517,#0C0E10)">
      <div style="height:13px"></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      engineGroups: [
        { title: 'MOD ENGINE I', knobs: ['RATE I', 'DEPTH I'] },
        { title: 'MOD ENGINE II', knobs: ['RATE II', 'DEPTH II'] }
      ],
      lowerGroups: [
        { flex: 2, title: 'BBD LINE', knobs: ['DELAY CENTER', 'DECORRELATION'] },
        { flex: 3, title: 'CHARACTER', knobs: ['DRIFT', 'SATURATION', 'NOISE'] },
        { flex: 2, title: 'OUTPUT', knobs: ['MIX', 'OUTPUT TRIM'] }
      ]
    };
  }
}
</script>
</body>
</html>
