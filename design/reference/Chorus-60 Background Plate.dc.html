<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
@font-face { font-family: 'Librestile Extended'; src: url('assets/LibrestileExtBold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
html, body { margin: 0; padding: 0; background: #050506; }
a { color: #cfd7dc; }
a:hover { color: #fff; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:flex-start;padding:34px 24px;background:#050506;overflow-x:auto">
  <div id="panel" style="width:1280px;flex:0 0 1280px;margin-inline:auto;background:linear-gradient(#141618,#0E1012 35%,#0A0C0D);border:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 34px 70px -24px rgba(0,0,0,1)">

    <div style="display:flex;align-items:flex-end;gap:0;padding:16px 22px 14px;border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.05);background:linear-gradient(#191C1E,#101214)">
      <div style="display:flex;align-items:flex-end;gap:18px;flex-shrink:0;white-space:nowrap">
        <div style="font-family:'Librestile Extended','Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:.9;letter-spacing:.02em;color:#E6EBEE;text-shadow:0 1px 0 rgba(0,0,0,.9), 0 0 1px rgba(230,235,238,.5)">CHORUS-60</div>
        <div style="display:flex;flex-direction:column;gap:4px;padding-bottom:3px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.24em;color:#A5ADB2">BBD CHORUS PROCESSOR</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.24em;color:#8A9196">MODEL CH-60 · STEREO</div>
        </div>
      </div>

      <div style="flex:1"></div>

      <div style="display:flex;align-items:flex-end;gap:6px;flex-shrink:0">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.24em;color:#8A9196">PROGRAM</div>
          <div style="display:flex;align-items:stretch;height:28px;background:#07090A;border:1px solid #363C41;box-shadow:0 2px 6px rgba(0,0,0,.9) inset">
            <div style="width:59px;border-right:1px solid #2A3035"></div>
            <div style="width:352px"></div>
          </div>
        </div>
        <div style="width:46px;height:28px"></div>
        <div style="width:57px;height:28px"></div>
      </div>

      <div style="display:flex;gap:8px;padding-left:16px;flex-shrink:0;white-space:nowrap">
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.24em;color:#8A9196">IN</div>
          <div style="width:54px;height:28px;background:#07090A;border:1px solid #363C41;box-shadow:0 2px 6px rgba(0,0,0,.9) inset"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:9px;letter-spacing:.24em;color:#8A9196">OUT</div>
          <div style="width:54px;height:28px;background:#07090A;border:1px solid #363C41;box-shadow:0 2px 6px rgba(0,0,0,.9) inset"></div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:stretch;gap:0;padding:18px 22px 22px;background:linear-gradient(#0E1012,#0A0C0D)">

      <div style="flex:0 0 220px;display:flex;flex-direction:column">
        <div style="height:46px;background:linear-gradient(#2F6DB8,#1F5798);display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.34em;color:#EEF2F4;text-indent:.34em">CHORUS</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:41px 0 41px 4px">
          <div style="display:flex;align-items:center;gap:16px">
            <div style="width:132px;height:132px"></div>
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:15px;height:15px"></div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:#A5ADB2"><span style="visibility:hidden">II</span></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px">
            <div style="width:132px;height:132px"></div>
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:15px;height:15px"></div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;color:#A5ADB2"><span style="visibility:hidden">I</span></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px">
            <div style="width:132px;height:132px"></div>
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:15px;height:15px"></div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.14em;color:#A5ADB2"><span style="visibility:hidden">OFF</span></div>
            </div>
          </div>
        </div>
        <div style="height:24px;background:linear-gradient(#2F6DB8,#1F5798)"></div>
      </div>

      <div style="flex:0 0 1px;margin:0 21px;background:linear-gradient(transparent,rgba(0,0,0,.9) 12%,rgba(0,0,0,.9) 88%,transparent);box-shadow:1px 0 0 rgba(255,255,255,.06)"></div>

      <div style="flex:1;display:flex;flex-direction:column;gap:16px;min-width:0">

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px 7px">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.28em;color:#E6EBEE">DELAY MODULATION</div>
            <div style="display:flex;gap:24px">
              <div style="font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.06em;color:#8A9196"><span style="visibility:hidden">250 ms / DIV</span></div>
            </div>
          </div>
          <div style="height:118px;background:linear-gradient(#06080A,#0B0F11);border:1px solid #0A0C0D;box-shadow:0 2px 7px rgba(0,0,0,.85) inset"></div>
        </div>

        <div style="border:1px solid #000;background:linear-gradient(#131517,#0C0E10);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;padding:8px 18px 12px">
          <div style="display:flex;align-items:center;gap:9px;padding-bottom:7px;border-bottom:1px solid rgba(0,0,0,.6);box-shadow:0 1px 0 rgba(255,255,255,.05)">
            <div style="width:8px;height:8px"></div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.28em;color:#A5ADB2"><span style="visibility:hidden">MOD ENGINE</span></div>
            <div style="flex:1"></div>
            <div style="height:12px"></div>
          </div>
          <div style="display:flex;align-items:flex-start;justify-content:center;gap:20px;padding:12px 0 0">
            <sc-for list="{{ modKnobs }}" as="k" hint-placeholder-count="4">
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:176px">
                <div style="position:relative;width:176px;height:164px">
                  <sc-for list="{{ k.ticks }}" as="t" hint-placeholder-count="5">
                    <div style="position:absolute;left:{{ t.x }};top:{{ t.y }};width:2px;height:10px;background:#A5ADB2;transform:{{ t.rot }}"></div>
                  </sc-for>
                  <sc-for list="{{ k.marks }}" as="m" hint-placeholder-count="5">
                    <div style="position:absolute;left:{{ m.x }};top:{{ m.y }};width:52px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:12px;line-height:14px;color:#A5ADB2">{{ m.t }}</div>
                  </sc-for>
                  <div style="position:absolute;left:0;right:0;top:148px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.16em;color:#8A9196">{{ k.unit }}</div>
                </div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.18em;color:#A5ADB2;text-align:center"><span style="visibility:hidden">{{ k.label }}</span></div>
              </div>
            </sc-for>

            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:132px">
              <div style="position:relative;width:132px;height:164px">
                <div style="position:absolute;left:0;top:58px;width:44px;text-align:right;font-family:'Share Tech Mono',monospace;font-size:12px;line-height:14px;color:#A5ADB2">STEREO</div>
                <div style="position:absolute;left:0;top:92px;width:44px;text-align:right;font-family:'Share Tech Mono',monospace;font-size:12px;line-height:14px;color:#A5ADB2">MONO</div>
              </div>
              <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.18em;color:#A5ADB2;text-align:center"><span style="visibility:hidden">IMAGE</span></div>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:16px">
          <sc-for list="{{ lowerGroups }}" as="g" hint-placeholder-count="2">
            <div style="flex:{{ g.flex }};border:1px solid #000;background:linear-gradient(#131517,#0C0E10);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;padding:8px 16px 12px">
              <div style="padding-bottom:7px;border-bottom:1px solid rgba(0,0,0,.6);box-shadow:0 1px 0 rgba(255,255,255,.05);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.28em;color:#A5ADB2">{{ g.title }}</div>
              <div style="display:flex;justify-content:center;gap:22px;padding-top:10px">
                <sc-for list="{{ g.knobs }}" as="k" hint-placeholder-count="2">
                  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:158px">
                    <div style="position:relative;width:158px;height:144px">
                      <sc-for list="{{ k.ticks }}" as="t" hint-placeholder-count="5">
                        <div style="position:absolute;left:{{ t.x }};top:{{ t.y }};width:2px;height:9px;background:#A5ADB2;transform:{{ t.rot }}"></div>
                      </sc-for>
                      <sc-for list="{{ k.marks }}" as="m" hint-placeholder-count="5">
                        <div style="position:absolute;left:{{ m.x }};top:{{ m.y }};width:46px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:12px;line-height:14px;color:#A5ADB2">{{ m.t }}</div>
                      </sc-for>
                      <div style="position:absolute;left:0;right:0;top:128px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.16em;color:#8A9196">{{ k.unit }}</div>
                    </div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.18em;color:#A5ADB2;text-align:center">{{ k.label }}</div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;align-items:center;height:28px;box-sizing:border-box;padding:0 22px;border-top:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.045) inset;background:linear-gradient(#131517,#0C0E10)">
      <div style="font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.1em;color:#8A9196"><span style="visibility:hidden">BBD 1024 STAGE · v1.0</span></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const LIN = [0, 0.25, 0.5, 0.75, 1];
const PCT = ['0', '25', '50', '75', '100'];
const RATE_POS = [0, 0.287, 0.479, 0.784, 1];

// half-extent of a 12px Share Tech Mono label along the ray leaving the knob centre
const ADV = 7.2, LH = 14;
function edge(text, sx, cy) {
  const w = text.length * ADV, ax = Math.abs(sx), ay = Math.abs(cy);
  return Math.min(ax > 1e-6 ? (w / 2) / ax : 1e9, ay > 1e-6 ? (LH / 2) / ay : 1e9);
}
function ring(pos, labels, geo) {
  const ticks = [], marks = [];
  for (let i = 0; i < pos.length; i++) {
    const deg = -135 + 270 * pos[i], a = deg * Math.PI / 180;
    const sx = Math.sin(a), cx = Math.cos(a);
    ticks.push({
      x: (geo.cx + geo.rt * sx - 1).toFixed(1) + 'px',
      y: (geo.cy - geo.rt * cx - geo.tl / 2).toFixed(1) + 'px',
      rot: 'rotate(' + deg.toFixed(1) + 'deg)'
    });
    const rn = geo.rte + geo.gap + edge(labels[i], sx, cx);
    marks.push({
      t: labels[i],
      x: (geo.cx + rn * sx - geo.nw / 2).toFixed(1) + 'px',
      y: (geo.cy - rn * cx - 7).toFixed(1) + 'px'
    });
  }
  return { ticks, marks };
}
const GEO_MOD = { cx: 88, cy: 82, rt: 47, tl: 9, rte: 51.5, gap: 6, nw: 52 };
const GEO_GLB = { cx: 79, cy: 72, rt: 38, tl: 9, rte: 42.5, gap: 6, nw: 46 };

function cell(label, unit, pos, labels, geo) {
  const r = ring(pos, labels, geo);
  return { label, unit, ticks: r.ticks, marks: r.marks };
}

class Component extends DCLogic {
  renderVals() {
    return {
      modKnobs: [
        cell('RATE', 'Hz', RATE_POS, ['0.05','0.5','2','8','16'], GEO_MOD),
        cell('DEPTH', '%', LIN, PCT, GEO_MOD),
        cell('DELAY CENTER', 'ms', LIN, ['2','5','8','11','14'], GEO_MOD),
        cell('DECORRELATION', '%', LIN, PCT, GEO_MOD)
      ],
      lowerGroups: [
        { title: 'CHARACTER', flex: 3, knobs: [
          cell('DRIFT', '%', LIN, PCT, GEO_GLB),
          cell('SATURATION', '%', LIN, PCT, GEO_GLB),
          cell('NOISE', '%', LIN, PCT, GEO_GLB)
        ] },
        { title: 'OUTPUT', flex: 2, knobs: [
          cell('MIX', '%', LIN, PCT, GEO_GLB),
          cell('OUTPUT TRIM', 'dB', LIN, ['−12','−6','0','+6','+12'], GEO_GLB)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
